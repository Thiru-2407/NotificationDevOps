<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Notification | v1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Add Notification</h1>
        <p class="subtitle">Notification Management System — Version 1</p>

        <section class="panel">
            <h2>Create a new alert</h2>
            <form action="/add" method="POST">
                <label for="title">Alert title</label>
                <input id="title" name="title" maxlength="100"
                       placeholder="Enter alert title" required>

                <label for="message">Alert message</label>
                <textarea id="message" name="message" maxlength="500"
                          placeholder="Enter alert message" required></textarea>

                <button type="submit">Add Alert</button>
            </form>

            {% if success %}
                <p class="success">{{ success }}</p>
            {% endif %}
        </section>

        <footer>v1 · Add Notification</footer>
    </main>
</body>
</html>
